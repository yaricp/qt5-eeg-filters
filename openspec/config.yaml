schema: spec-driven

context: |
  Desktop PyQt5 GUI for filtering EEG / evoked-potential signals:
  Chebyshev bandpass filters, extremum search in movable plot regions,
  pyqtgraph plotting, NeuroExplorer ASCII input.
  Tech stack: Python 3.12, Poetry (in-project .venv), PyQt5, pyqtgraph,
  scipy/numpy/pandas. App code lives in src/ (MVC-like flat modules).
  Conventions: TDD (pytest), flake8 lint, work on dev branch,
  push to dev triggers CI (lint + Docker image to GHCR).
  Full context: openspec/project.md

